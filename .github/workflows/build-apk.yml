herename: Build ASI APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with WebView
        uses: Laude/android-webview@main
        with:
          url: https://asi-git-main-shahrukhkassars-projects.vercel.app
          app-name: ASI Study
          package-name: com.asi.studyapp

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASI-App
          path: app/build/outputs/apk/debug/app-debug.apk
